<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KREDENTRA — Accounting, Simplified. Intelligence, Amplified.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#080808;--bg2:#141414;--gold:#D4AF37;--champ:#E5C77A;--tx:#fff;--mut:#A0A0A0;--line:rgba(212,175,55,.18);--glass:rgba(255,255,255,.04);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Plus Jakarta Sans',Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--champ);outline-offset:3px}
.w{max-width:1160px;margin:0 auto;padding:0 20px}section{padding:72px 0}
h1,h2,h3{line-height:1.12;margin:0 0 14px;letter-spacing:-.02em}h1{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:800}h2{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700}h3{font-size:1.1rem}
p{margin:0 0 14px;color:var(--mut)}.g{background:linear-gradient(120deg,var(--gold),var(--champ));-webkit-background-clip:text;background-clip:text;color:transparent}
.eye{color:var(--gold);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
header{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(8,8,8,.9);z-index:-1}
nav{display:flex;align-items:center;gap:6px;height:66px}nav .sp{flex:1}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;margin-right:14px}
.nl{padding:8px 12px;border-radius:8px;color:#d0d0d0;font-size:.92rem;background:none;border:0;font-family:inherit;cursor:pointer}.nl:hover,.nl.on{color:var(--champ)}
.links{display:flex;align-items:center;gap:4px}.dd{position:relative}.dm{display:none;position:absolute;right:0;top:100%;min-width:200px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px}.dd.open .dm{display:block}.dm a{display:block;padding:9px 12px;border-radius:8px;font-size:.9rem;color:#ccc}.dm a:hover{background:var(--glass);color:var(--champ)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font:600 .95rem inherit;font-family:inherit;border:1px solid var(--gold);color:var(--champ);background:transparent;cursor:pointer;transition:.25s}.btn:hover{background:var(--glass);transform:translateY(-1px)}
.btn.p{background:linear-gradient(120deg,var(--gold),var(--champ));color:#111;border:0}.btn.p:hover{box-shadow:0 8px 28px rgba(212,175,55,.3)}.btn.s{padding:8px 16px;font-size:.88rem}
#bg{display:none;background:none;border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.card{background:linear-gradient(160deg,var(--glass),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:18px;padding:24px;transition:.3s}.card:hover{border-color:rgba(212,175,55,.5);transform:translateY(-3px)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(212,175,55,.12);color:var(--gold);margin-bottom:14px;font-size:1.1rem}
.hero{padding:70px 0 40px;background:radial-gradient(700px 360px at 75% 0,rgba(212,175,55,.14),transparent)}.hero .in{display:grid;gap:40px;grid-template-columns:1fr 1.1fr;align-items:center}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.dash{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(212,175,55,.08)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.kp div{background:var(--glass);border-radius:12px;padding:10px 12px}.kp small{color:var(--mut);font-size:.72rem}.kp b{display:block;font-size:1.05rem}
.tx{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:.85rem;color:#ccc}.up{color:#7bd88f}.dn{color:#f08a8a}
.ai{background:rgba(212,175,55,.08);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.82rem;margin-top:10px;color:#e8d9aa}
.note{border:1px dashed var(--gold);background:rgba(212,175,55,.06);border-radius:14px;padding:14px 18px;font-size:.9rem;color:#e8d9aa}
.alt{background:var(--bg2)}.ctr{text-align:center;max-width:680px;margin:0 auto 40px}ul.ck{list-style:none;padding:0;margin:0 0 18px}ul.ck li{padding:5px 0 5px 24px;position:relative;color:#ddd;font-size:.93rem}ul.ck li::before{content:"✓";position:absolute;left:0;color:var(--gold)}
.price{font-size:2.3rem;font-weight:800}.price small{font-size:.9rem;color:var(--mut);font-weight:500}.rec{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 20px 60px rgba(212,175,55,.15);position:relative}.badge{position:absolute;top:-12px;right:18px;background:var(--gold);color:#111;font-size:.72rem;font-weight:800;padding:4px 12px;border-radius:99px}
details{background:var(--glass);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 20px}summary{cursor:pointer;padding:16px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}summary::after{content:"+";color:var(--gold);font-size:1.3rem}details[open] summary::after{content:"–"}details p{padding-bottom:14px}
form{display:grid;gap:14px}label{font-size:.85rem;color:#ccc;display:grid;gap:6px}input,textarea,select{background:#0e0e0e;border:1px solid #2c2c2c;border-radius:10px;padding:12px 14px;color:#fff;font:inherit}input:focus,textarea:focus{border-color:var(--gold);outline:0}.er{color:#f08a8a;font-size:.78rem;min-height:1em}.ok{color:#7bd88f;font-weight:600}
.auth{max-width:440px;margin:0 auto}.chat{max-width:560px;display:grid;gap:10px}.b{padding:10px 14px;border-radius:14px;font-size:.88rem;max-width:88%}.u{background:var(--glass);justify-self:end}.a{background:rgba(212,175,55,.1);border:1px solid var(--line);color:#f1e5bd}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:28px}.seg button{border:0;background:none;color:#ccc;padding:8px 20px;border-radius:99px;cursor:pointer;font:600 .9rem inherit;font-family:inherit}.seg .on{background:var(--gold);color:#111}
.ph{border:1px solid var(--line);border-radius:18px;background:var(--bg2);padding:28px;display:grid;place-items:center;min-height:200px;text-align:center}
footer{border-top:1px solid var(--line);padding:48px 0 28px;background:#050505}.fg{display:grid;gap:30px;grid-template-columns:1.4fr 2fr}.fl{display:flex;flex-wrap:wrap;gap:8px 20px}.fl a{color:var(--mut);font-size:.9rem}.fl a:hover{color:var(--champ)}
.page{animation:f .45s ease}@keyframes f{from{opacity:0;transform:translateY(10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.hero .in,.fg{grid-template-columns:1fr}#bg{display:block}nav .links{display:none;position:absolute;left:0;right:0;top:66px;background:var(--bg);flex-direction:column;align-items:stretch;padding:12px 20px;border-bottom:1px solid var(--line)}nav .links.open{display:flex}.dm{position:static}.hide-m{display:none}}
</style></head><body>
<header><div class="w"><nav aria-label="Main"><a href="#home" class="logo" aria-label="KREDENTRA home"><svg width="30" height="30" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D4AF37"/><stop offset="1" stop-color="#E5C77A"/></linearGradient></defs><path d="M4 28V12l7-7h4L9 11v17zM13 5h8L12 16l11 12h-8L9 18z" fill="url(#lg)"/></svg>KREDENTRA</a>
<div class="links" id="links" style="display:contents"></div><div class="sp"></div><button id="bg" aria-label="Menu" aria-expanded="false">☰</button></nav></div></header>
<main id="app"></main><footer><div class="w"><div class="fg"><div><b style="letter-spacing:.14em">KREDENTRA</b><p style="margin-top:8px">Accounting, Simplified. Intelligence, Amplified.</p></div><div class="fl" id="fl"></div></div><p style="margin-top:30px;font-size:.82rem">© 2026 KREDENTRA. All Rights Reserved.</p></div></footer>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NAV=[['home','Home'],['about','About'],['features','Features'],['ai','AI Assistant'],['pricing','Pricing'],['downloads','Downloads'],['contact','Contact']];
const MORE=[['security','Security'],['faq','FAQ'],['privacy','Privacy Policy'],['terms','Terms and Conditions'],['refund','Refund Policy']];
const FT=[...NAV.slice(0,5),['security','Security'],['downloads','Downloads'],['contact','Contact'],['faq','FAQ'],['privacy','Privacy Policy'],['terms','Terms and Conditions'],['refund','Refund Policy']];
const G=['▤','⇄','☰','◧','▦','❏','％','⇩','⌂','◌'];
const FEATS=['Smart Transaction Recording|Capture income, expenses and transfers in a guided flow.','Automatic Journal Entries|Balanced double-entry journals generated from each transaction.','General Ledger|Every account’s activity in one connected, searchable ledger.','Financial Statements|Profit and Loss, Balance Sheet and Cash Flow, always current.','Inventory Management|Products, stock levels, purchases, sales and COGS.','Invoice Management|Create invoices, export PDFs and track what is owed.','Tax Management|Configurable rates, VAT calculations and tax summaries.','Excel and PDF Exports|Share reports and records in the formats clients expect.','Multi-business Management|Run several business profiles from a single login.','Offline Accounting|Keep recording when the connection drops (planned).'];
const AIF=['AI Chat Assistant|Ask accounting questions in plain language.','AI Transaction Assistant|Suggests accounts and categories as you record.','Accounting Error Detection|Flags possible issues for you to review.','Financial Analysis|Trends, ratios and period comparisons explained.','Financial Report Insights|Plain-language reading of your statements.','Smart Recommendations|Practical suggestions to tidy and improve records.','Tax Assistance|Help understanding tax set-up and summaries.'];
const card=(a,i)=>{const[t,d]=a.split('|');return`<div class="card"><div class="ic">${G[i%10]}</div><h3>${t}</h3><p style="margin:0">${d}</p></div>`};
const cta=(h,a,b)=>`<section><div class="w"><div class="card ctr" style="margin:0 auto;padding:48px 24px"><h2>${h}</h2><div class="row" style="justify-content:center"><a class="btn p" href="#register">${a}</a><a class="btn" href="#pricing">${b}</a></div></div></div></section>`;
const head=(e,h,p)=>`<section style="padding-bottom:20px"><div class="w ctr" style="margin-bottom:0"><div class="eye">${e}</div><h1 style="font-size:clamp(2rem,5vw,3.2rem)">${h}</h1><p>${p||''}</p></div></section>`;
const AIN='AI highlights potential issues but cannot guarantee error-free accounting. Suggestions must be reviewed and approved by an authorized accounting professional.';
const dash=()=>`<div class="dash" aria-label="Dashboard preview (demo data)"><div class="kp"><div><small>Revenue</small><b>LKR 2.84M</b></div><div><small>Expenses</small><b>LKR 1.62M</b></div><div><small>Net profit</small><b class="up">LKR 1.22M</b></div></div>
<svg viewBox="0 0 400 120" width="100%" role="img" aria-label="Cash flow chart"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D4AF37" stop-opacity=".35"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></linearGradient></defs><path d="M0 90 L50 70 L100 80 L150 45 L200 55 L250 30 L300 40 L350 15 L400 22 V120 H0Z" fill="url(#ar)"/><path d="M0 90 L50 70 L100 80 L150 45 L200 55 L250 30 L300 40 L350 15 L400 22" fill="none" stroke="#E5C77A" stroke-width="2"/></svg>
<div class="tx"><span>Invoice #1042 · Customer</span><span class="up">+ LKR 185,000</span></div><div class="tx"><span>Office supplies</span><span class="dn">− LKR 12,400</span></div><div class="tx"><span>Stock purchase</span><span class="dn">− LKR 96,000</span></div>
<div class="ai">✦ AI insight: Expenses are 8% above last month. One entry may be missing a category — review suggested.</div></div>`;
const chat=()=>`<div class="chat card" aria-label="AI chat preview (demo)"><div class="b u">Why did my net profit drop in October?</div><div class="b a">Based on your demo data, purchases rose while sales were flat. Two entries look uncategorised — please review them before relying on this.</div><div class="b u">Check for possible errors.</div><div class="b a">Found 2 items to review: a duplicate-looking payment and an unbalanced draft. Final approval stays with you.</div></div>`;
const plans=()=>`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:stretch"><div class="card"><h3>Free</h3><div class="price">LKR 0</div><ul class="ck"><li>Unlimited standard transactions</li><li>Journal entries &amp; General Ledger</li><li>Financial Statements</li><li>Inventory, Invoicing &amp; Tax Management</li><li>Excel and PDF exports</li><li>Business Management &amp; standard reporting</li></ul><a class="btn" href="#register">Get Started Free</a></div>
<div class="card" id="pm"><h3>AI Premium — Monthly</h3><div class="price">LKR 4,999 <small>/ month</small></div><p>Everything in Free, plus:</p><ul class="ck">${AIF.map(x=>`<li>${x.split('|')[0]}</li>`).join('')}</ul><button class="btn" data-pick="Monthly">Choose Monthly</button></div>
<div class="card rec" id="py"><span class="badge">RECOMMENDED</span><h3>AI Premium — Yearly</h3><div class="price">LKR 45,999 <small>/ year</small></div><p class="up" style="margin-bottom:8px">Save LKR 13,989 vs 12 monthly payments</p><p>Everything in Free, plus all AI Premium features.</p><button class="btn p" data-pick="Yearly">Choose Yearly</button></div></div>`;
const P={};
P.home=()=>`<div class="hero"><div class="w in"><div><div class="eye">Accounting software · AI-assisted</div><h1>Accounting, Simplified. <span class="g">Intelligence, Amplified.</span></h1><p style="font-size:1.1rem">Experience a smarter way to manage accounting. KREDENTRA brings transactions, financial statements, business management and intelligent AI assistance together in one powerful platform.</p><div class="row"><a class="btn p" href="#register">Get Started Free</a><a class="btn" href="#features">Explore Features</a></div></div>${dash()}</div></div>
<section><div class="w"><div class="ctr"><div class="eye">Introduction</div><h2>A modern platform for financial management</h2></div><div class="grid">${['Smarter accounting workflows|Guided recording that keeps books organised.','Connected financial records|Transactions, ledgers and statements stay in sync.','Automated financial reporting|Reports built from your records, ready to export.','Intelligent error detection|Possible issues flagged for your review.','Secure cloud storage|Planned encryption and backups for your data.'].map(card).join('')}</div></div></section>
<section class="alt"><div class="w"><div class="ctr"><div class="eye">Features</div><h2>Everything your books need</h2></div><div class="grid">${FEATS.map(card).join('')}</div></div></section>
<section><div class="w" style="display:grid;gap:36px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center"><div><div class="eye">KREDENTRA AI Premium</div><h2>Your Accounting Assistant. <span class="g">Powered by AI.</span></h2><p>Transaction assistance, possible error detection, financial analysis, report explanations, smart recommendations and tax assistance.</p><div class="note">${AIN}</div><div class="row"><a class="btn p" href="#ai">Explore AI</a></div></div>${chat()}</div></section>
<section class="alt"><div class="w"><div class="ctr"><div class="eye">Pricing</div><h2>Standard accounting is free</h2><p>AI features require a paid subscription. Prices in LKR.</p></div>${plans()}</div></section>${cta('Make Accounting Smarter with KREDENTRA.','Start for Free','Explore Premium')}`;
P.about=()=>head('About Us','A technology platform for easier, more organised, more intelligent accounting','KREDENTRA is a professional accounting platform for accountants, firms and businesses.')+`<section><div class="w grid">${['Vision|A world where accounting is clear, connected and assisted by trustworthy intelligence.','Mission|Make accounting easier to do, easier to review and easier to understand.','Why we exist|Many teams juggle disconnected tools, manual entries and late reports. KREDENTRA brings these together.','Problems we aim to solve|Repetitive data entry, hidden errors, scattered records and slow reporting.','Core values|Accuracy · Clarity · Security · Accountability · Simplicity'].map(card).join('')}</div></div></section>`;
P.features=()=>{const S={Accounting:'Transaction recording|Automatic journal generation|Chart of Accounts|General Ledger|Trial Balance|Financial Statements|Accounting period management','Business Management':'Multiple business profiles|Customer management|Supplier management|Employee roles and permissions|Business dashboards',Inventory:'Product management|Stock tracking|Purchases and sales|Cost of Goods Sold|Stock alerts|Inventory reports',Invoicing:'Invoice creation|PDF generation|Payment tracking|Outstanding invoices|Customer records',Reporting:'Profit and Loss Statement|Balance Sheet|Cash Flow Statement|Statement of Changes in Equity|Trial Balance|General Ledger|Journal Entries|Accounts Receivable|Accounts Payable|Inventory Valuation (LKR supported)','Tax Management':'Configurable tax rates|VAT calculations|Tax summaries|Tax reports'};
return head('Features','Built for the whole accounting cycle','LKR is supported as the platform currency.')+`<section><div class="w grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">${Object.entries(S).map(([k,v],i)=>`<div class="card"><div class="ic">${G[i]}</div><h3>${k}</h3><ul class="ck" style="margin:0">${v.split('|').map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div></section>`+cta('Make Accounting Smarter with KREDENTRA.','Start for Free','Explore Premium')};
P.ai=()=>`<div class="hero"><div class="w in"><div><div class="eye">KREDENTRA AI Premium</div><h1 style="font-size:clamp(2rem,5vw,3.4rem)">Meet the Intelligence Behind <span class="g">Smarter Accounting.</span></h1><div class="note">${AIN}</div><div class="row"><a class="btn p" href="#pricing">Explore AI Premium</a></div></div>${chat()}</div></div><section><div class="w grid">${AIF.map(card).join('')}</div></section>`;
P.pricing=()=>head('Pricing','Free accounting. Optional AI.','Standard accounting is free. AI features require a paid AI Premium subscription.')+`<section style="padding-top:20px"><div class="w">${plans()}<div id="pay"></div></div></section>`;
P.security=()=>head('Security','Planned security features','Described as design goals; no certifications or compliance are claimed.')+`<section><div class="w grid">${['Secure authentication|Protected sign-in flows.','Password hashing|Passwords never stored in plain text.','Role-based permissions|Limit what each team member can do.','Data encryption|Encryption in transit and at rest.','Automatic backups|Regular backups of your records.','Audit trails|Track who changed what, and when.','Account recovery|Reset access safely.','Payment verification|Manual admin review of every payment.','Session management|Control and expire active sessions.'].map(card).join('')}</div></section>`;
P.downloads=()=>head('Downloads','Android and Windows applications','The applications have not been released yet.')+`<section><div class="w grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${[['Android','Accounting on the go: record transactions, view dashboards and invoices.','Android 8.0+ (planned) · 2 GB RAM'],['Windows','Desktop software for full-featured accounting and offline work.','Windows 10/11 64-bit (planned) · 4 GB RAM']].map(([n,d,r])=>`<div class="card"><div class="ph"><div><div class="g" style="font-size:1.6rem;font-weight:800">${n}</div><small style="color:var(--mut)">Preview placeholder</small></div></div><h3 style="margin-top:16px">KREDENTRA for ${n}</h3><p>${d}</p><p><b>Requirements:</b> ${r}</p><button class="btn" disabled style="opacity:.6;cursor:not-allowed">Coming Soon</button></div>`).join('')}</div>
<div class="w" style="max-width:520px;margin-top:40px"><div class="card"><h3>Get notified of future releases</h3>${F('nt',[['email','Email address','email']],'Notify me')}<p style="font-size:.8rem;margin:10px 0 0">Demo only — not connected to a backend, nothing is sent or stored.</p></div></div></section>`;
P.contact=()=>head('Contact Us','We’d like to hear from you')+`<section style="padding-top:20px"><div class="w" style="max-width:640px"><div class="card">${F('ct',[['name','Full name','text'],['email','Email address','email'],['subject','Subject','text'],['message','Message','area']],'Send message')}<p style="font-size:.8rem;margin:12px 0 0">Demo form — not connected to a backend.</p></div><p style="margin-top:20px">Email: <i>[support email — to be added]</i> · Phone: <i>[to be added]</i> · Address: <i>[to be added]</i></p></div></section>`;
const FQ=[['What is KREDENTRA?','A professional accounting platform with optional AI assistance for accountants, firms and businesses.'],['Is KREDENTRA free?','Standard accounting is free. AI features require AI Premium.'],['What is included in AI Premium?','AI Chat, Transaction Assistant, Error Detection, Financial Analysis, Report Insights, Smart Recommendations and Tax Assistance.'],['Can I manage multiple businesses?','Yes, multi-business management is part of the platform.'],['Can I export accounting reports?','Yes, to Excel and PDF.'],['Does KREDENTRA support offline accounting?','Offline accounting is a planned capability.'],['Can I use KREDENTRA on Android?','An Android app is planned and not yet released.'],['Can I use KREDENTRA on Windows?','A Windows app is planned and not yet released.'],['How do I purchase AI Premium?','Choose a package, follow the bank transfer instructions, upload your receipt and reference, and submit a request.'],['How does payment approval work?','An admin reviews your request and approves or rejects it. AI is activated after approval.'],['Can I import existing accounting records?','Import options are not yet confirmed; details will be published before launch.'],['How does AI error detection work?',AIN]];
P.faq=()=>head('FAQ','Frequently asked questions')+`<section style="padding-top:20px"><div class="w" style="max-width:760px">${FQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></section>`;
const auth=m=>head(m=='login'?'Login':'Register',m=='login'?'Welcome back':'Create your account')+`<section style="padding-top:20px"><div class="w auth"><div class="note" style="margin-bottom:16px">Demonstration interface. No real authentication is connected; passwords are not stored.</div><div class="card"><button class="btn" style="width:100%;margin-bottom:16px" data-g>Continue with Google (demo)</button>${F(m,m=='login'?[['email','Email','email'],['password','Password','password']]:[['name','Full name','text'],['email','Email','email'],['password','Password (8+ characters)','password']],m=='login'?'Login':'Create account')}<p style="margin:14px 0 0;font-size:.88rem">${m=='login'?'<a href="#forgot" class="g">Forgot password?</a> · <a href="#register" class="g">Register</a>':'No email verification is planned. <a href="#login" class="g">Existing user? Login</a>'}</p></div></div></section>`;
P.login=()=>auth('login');P.register=()=>auth('register');
P.forgot=()=>head('Account','Reset your password')+`<section style="padding-top:20px"><div class="w auth"><div class="card">${F('fg',[['email','Email','email']],'Send reset link')}<p style="font-size:.8rem;margin:10px 0 0">Demo only — no email is sent.</p></div></div></section>`;
const POL={privacy:'Privacy Policy',terms:'Terms and Conditions',refund:'Refund Policy'};
Object.keys(POL).forEach(k=>P[k]=()=>head('Legal',POL[k])+`<section style="padding-top:20px"><div class="w" style="max-width:740px"><div class="note">Placeholder. The final ${POL[k]} will be drafted and reviewed by a qualified professional before launch.</div></div></section>`);
function F(id,fs,btn){return`<form id="f-${id}" novalidate>${fs.map(([n,l,t])=>`<label>${l}${t=='area'?`<textarea name="${n}" rows="4"></textarea>`:`<input name="${n}" type="${t}" autocomplete="off">`}<span class="er" role="alert"></span></label>`).join('')}<button class="btn p" type="submit">${btn}</button><div class="ok" aria-live="polite"></div></form>`}
function bindForms(){$$('form[id^=f-]').forEach(f=>f.onsubmit=e=>{e.preventDefault();let bad=0;[...f.elements].forEach(i=>{if(!i.name)return;const v=i.value.trim();let m='';if(!v)m='Required';else if(i.type=='email'&&!/^\S+@\S+\.\S+$/.test(v))m='Enter a valid email';else if(i.type=='password'&&v.length<8)m='At least 8 characters';i.parentNode.querySelector('.er').textContent=m;bad+=!!m});if(bad)return;const b=f.querySelector('button'),o=b.textContent;b.disabled=1;b.textContent='Processing…';setTimeout(()=>{b.disabled=0;b.textContent=o;f.reset();f.querySelector('.ok').textContent='✓ Demo only: validated locally. Nothing was sent or stored.'},900)});
$$('[data-g]').forEach(b=>b.onclick=()=>alert('Google login is a demo placeholder. Not connected.'));
$$('[data-pick]').forEach(b=>b.onclick=()=>{const el=$('#pay')||(location.hash='#pricing',null);if(!el){setTimeout(()=>$$('[data-pick="'+b.dataset.pick+'"]')[0]?.click(),60);return}
el.innerHTML=`<div class="card" style="margin-top:28px" id="pw"><h3>Payment request — AI Premium ${b.dataset.pick}</h3><p>Manual bank transfer. Bank details will be shown securely after sign-in once the backend is live; none are displayed here.</p><ol style="color:#ccc;padding-left:20px;margin:0 0 16px"><li>Select package ✓</li><li>View secure payment instructions</li><li>Upload bank receipt</li><li>Enter payment reference</li><li>Submit request</li><li>Admin reviews, approves or rejects</li><li>AI activates after approval</li></ol><form id="f-pay" novalidate><label>Payment reference<input name="ref" type="text"><span class="er" role="alert"></span></label><label>Bank receipt<input name="rc" type="file" accept="image/*,.pdf"></label><button class="btn p">Submit request (demo)</button><div class="ok" aria-live="polite"></div></form><p style="font-size:.8rem;margin:10px 0 0">No payment is processed and no subscription is activated in this prototype.</p></div>`;bindForms();$('#pw').scrollIntoView({behavior:'smooth'})})}
function chrome(r){$('#links').innerHTML=NAV.map(([k,l])=>`<a class="nl ${k==r?'on':''}" href="#${k}">${l}</a>`).join('')+`<div class="dd"><button class="nl" aria-haspopup="true" aria-expanded="false" id="mb">More ▾</button><div class="dm">${MORE.map(([k,l])=>`<a href="#${k}">${l}</a>`).join('')}</div></div><a class="btn s" href="#login">Login</a><a class="btn p s" href="#register">Get Started</a>`;
$('#links').className='links';$('#links').style.display='';$('#mb').onclick=e=>{e.stopPropagation();const d=e.target.parentNode;d.classList.toggle('open');e.target.setAttribute('aria-expanded',d.classList.contains('open'))}}
function route(){const r=(location.hash||'#home').slice(1);const k=P[r]?r:'home';$('#app').innerHTML=`<div class="page">${P[k]()}</div>`;chrome(k);$('#fl').innerHTML=FT.map(([a,b])=>`<a href="#${a}">${b}</a>`).join('');document.title='KREDENTRA'+(k=='home'?'':' — '+k[0].toUpperCase()+k.slice(1));scrollTo(0,0);bindForms()}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))$$('.dd').forEach(d=>d.classList.remove('open'));if(e.target.closest('#links a')||e.target.closest('.dm a'))$('#links').classList.remove('open');if(e.target.closest('#bg')){const l=$('#links');l.classList.toggle('open');$('#bg').setAttribute('aria-expanded',l.classList.contains('open'))}});
addEventListener('hashchange',route);route();
</script></body></html>
